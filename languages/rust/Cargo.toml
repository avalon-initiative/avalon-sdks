[package]
name = "avalon-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["avalon", "sdk", "identity", "games"]
categories = ["api-bindings"]
# The tests listed last read files outside this directory (the shared conformance vectors and
# fixtures) and are left out of the package; the other tests are self-contained.
exclude = ["tests/conformance.rs", "tests/nodes_topology.rs", "tests/topology_walk.rs"]
description = "Rust reference SDK for integrating a game with Avalon. Talks to the avalon-server API over its published schema and owns its own wire types — no dependency on any other crate in this workspace, and it never exposes internal database structures. The C# SDK (bindings/csharp) is the flagship developer-facing surface; this crate is both the reference implementation and directly usable by Rust-based games/tools."

[dependencies]
# Issue #386: #[derive(AvalonSchema)] — re-exported through schema.rs.
# Nested workspace member (#772) — this crate has no dependency on the core
# protocol crates, only on this SDK, so it lives under rust/ rather
# than alongside protocol/chain/indexer/server.
avalon-schema-derive.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# "time" is for the device-login poll loop's backoff sleep
# (`device_login::DeviceLogin::wait`, #398).
tokio = { workspace = true, features = ["sync", "time", "rt"] }
# Achievements issuance (#34) signs attestations locally, in-process — the
# server never sees this integrator's private key, only a detached
# signature.
ed25519-dalek.workspace = true
base64.workspace = true
# Full jitter on retry backoff (issue #47).
rand.workspace = true
# Hex-decoding trust-anchor verify keys and STH signatures (issue #482).
hex.workspace = true
# SHA-256 of a presented key for self-certifying shard ids.
sha2.workspace = true
# `AccountSession` (#699) drives a real WebAuthn registration/login
# ceremony client-side against a virtual authenticator — the same
# `testable`-feature approach `crates/cli/src/dev_tools.rs` already proved
# for `avalon create-identity`/`avalon login`, now a runtime dependency of
# this crate rather than only a dev-dependency of its own tests.
passkey-types.workspace = true
passkey-client.workspace = true
passkey-authenticator.workspace = true
coset = "0.4"
url.workspace = true

[features]
# Exposes Session::grant_for_testing, a capability-grant escape hatch that
# has no business in a real game's build — see its doc comment in
# rust/src/lib.rs. Enabled for this crate's own tests only, below.
test-util = []

[dev-dependencies]
avalon-sdk = { path = ".", features = ["test-util"] }
tokio.workspace = true
sqlx.workspace = true
rand.workspace = true
wiremock.workspace = true

[build-dependencies]
# Must match the schemars major version typify 0.8 itself depends on
# (0.8.x) — typify's TypeSpace API takes schemars 0.8's Schema type, and a
# newer schemars major here would silently be a different, incompatible
# type.
schemars = "0.8"
serde_json.workspace = true
typify = "0.8.0"
