name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Rust checks
        run: bash scripts/release-checks.sh rust

  csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: C# checks
        run: bash scripts/release-checks.sh csharp

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: languages/typescript
      - name: TypeScript checks
        run: bash scripts/release-checks.sh ts

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Every SDK-facing server route is covered
        run: python3 scripts/check-sdk-coverage.py

  # One stable check name for the branch ruleset to require.
  ci:
    if: always()
    needs: [rust, csharp, typescript, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
