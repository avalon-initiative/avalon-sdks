name: Release SDKs

# Pushing a v<X.Y.Z>[-title] tag (created by `make release-tag`) releases all three
# SDKs together: the TypeScript package to GitHub Packages (npm), the C# package to
# the GitHub Packages NuGet feed, and one GitHub Release carrying the npm tarball, the
# NuGet package, the two Rust .crate files and a SHA256SUMS file over all of them.
# GitHub Packages has no cargo registry, so the crates are release assets only. Every
# check and every pack runs before anything is published.
#
# A manual dispatch runs the same checks and packs and uploads the release files as a
# workflow artifact; it never publishes, tags or creates a release, whatever dry_run
# says. Use it to exercise the pipeline without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload workflow artifacts only; publish nothing
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to release."; exit 1; }

      - name: Verify tag matches every SDK's version
        if: github.ref_type == 'tag'
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@avalon-initiative"

      - name: Install TypeScript dependencies
        run: npm ci
        working-directory: languages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checks
        run: bash scripts/release-checks.sh all

      - name: Pack TypeScript
        run: npm pack
        working-directory: languages/typescript

      - name: Pack C#
        run: dotnet pack languages/csharp/AvalonSdk/AvalonSdk.csproj -c Release --no-build -o out --nologo

      - name: Pack the Rust crates and write SHA256SUMS
        run: bash scripts/release-assets.sh

      - name: Upload the release files as a workflow artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-assets/*
          if-no-files-found: error

      - name: Publish the TypeScript package
        if: env.PUBLISH == 'true'
        run: npm publish
        working-directory: languages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the C# package to the GitHub Packages NuGet feed
        if: env.PUBLISH == 'true'
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/avalon-initiative/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Create the GitHub Release
        if: env.PUBLISH == 'true'
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
