name: Release Rust SDK

# Pushing a rust-v<X.Y.Z>[-title] tag (created by `make release-rust`) verifies the
# tag, runs the Rust checks, and creates a GitHub Release (GitHub attaches the source
# archive). The crate is not published to a registry yet: GitHub Packages has no cargo
# registry, and the crate depends on its sibling avalon-schema-derive by path, so
# registry publishing waits on the public-registry decision.
on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: write

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to release."; exit 1; }

      - name: Verify tag matches the version files
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2

      - name: Checks
        run: bash scripts/release-checks.sh rust

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
