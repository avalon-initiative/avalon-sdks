name: Vector sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'conformance/**'
      - 'docs/generated/openapi.json'
      - 'scripts/sync-protocol.sh'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Vendored vectors and OpenAPI match avalon-protocol main
        run: bash scripts/sync-protocol.sh check
