name: Release C# SDK

# Pushing a csharp-v<X.Y.Z>[-title] tag (created by `make release-csharp`) publishes
# that version of Avalon.Sdk to the GitHub Packages NuGet feed and attaches the
# package to a GitHub Release.
on:
  push:
    tags: ["csharp-v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-csharp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."; exit 1; }

      - name: Verify tag matches the version files
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Checks
        run: bash scripts/release-checks.sh csharp

      - name: Pack
        run: dotnet pack languages/csharp/AvalonSdk/AvalonSdk.csproj -c Release --no-build -o out --nologo

      - name: Publish package to the GitHub Packages NuGet feed
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/avalon-initiative/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" out/*.nupkg --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
