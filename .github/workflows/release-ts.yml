name: Release TypeScript SDK

# Pushing a ts-v<X.Y.Z>[-title] tag (created by `make release-ts`) publishes that
# version of @avalon-initiative/protocol-sdk to GitHub Packages.
on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-ts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."; exit 1; }

      - name: Verify tag matches the version files
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@avalon-initiative"

      - name: Install dependencies
        run: npm ci
        working-directory: languages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checks
        run: bash scripts/release-checks.sh ts

      - name: Pack
        run: npm pack
        working-directory: languages/typescript

      - name: Publish package
        run: npm publish
        working-directory: languages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" languages/typescript/*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
