[workspace]
resolver = "2"
members = [
    "languages/rust",
    "languages/rust/schema-derive",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/avalon-initiative/avalon-sdks"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
url = { version = "2", features = ["serde"] }
passkey-types = "0.5"
passkey-client = "0.5"
passkey-authenticator = { version = "0.5", features = ["testable"] }
wiremock = "0.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
